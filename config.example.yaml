# ==============================
# WeChat Web Client 配置示例
# 复制为 config.yaml 后按实际环境修改
# 公开示例只使用 127.0.0.1；真实地址和密钥只填写在本地 config.yaml 中。
# ==============================

# 本后端的公网 IP 或域名。远程客户端 Hook 没有公网 IP，
# 由客户端 DLL 主动连接到这个地址。
ip: "127.0.0.1"

# 微信使用方式（三选一）
#   1 = 本地 Hook（DLL 注入本地微信，127.0.0.1）
#   2 = 远程客户端 Hook（客户端 DLL 无公网 IP，主动连本后端 WS/WSS）
#   3 = 远程服务器协议（服务器上运行的微信协议）
wechat_mode: 1

# --- local_hook 本地 Hook ---
local_hook_host: "127.0.0.1"
local_hook_api_port: 30001
local_hook_mgr_port: 29999
# 微信安装目录；留空时管理器读取本机注册表，也可在“启动微信”面板填写。
local_hook_wechat_path: ""

# --- remote_hook 远程客户端 Hook ---
# agent_ws_enabled=true 时通过下方 /agent 长连接调用 DLL；
# 这些 host/port 仅作为关闭 agent_ws_enabled 时的旧 HTTP 直连配置。
remote_hook_host: "127.0.0.1"
remote_hook_api_port: 30001
remote_hook_mgr_port: 29999
# 远程管理器所在机器上的微信安装目录。
remote_hook_wechat_path: ""

# --- remote_protocol 远程协议 ---
remote_protocol_host: "127.0.0.1"
remote_protocol_api_port: 30001
remote_protocol_mgr_port: 29999

# --- 后端服务 ---
# 后端监听地址。DLL 使用 RemoteWS 直连 server_port 时需要监听 0.0.0.0；
# 若只通过前端端口或 Nginx 代理 /api 与 /agent，可改为 127.0.0.1。
server_host: "0.0.0.0"
server_port: 5000
# Web 前端访问密钥；浏览器需先输入该 key 才能访问聊天页和 API。
# 默认 key 为 admin。首次运行可用 admin 进入，但请在 config.yaml 中修改 web_access_key。
# 不要把真实密钥提交到 Git，可在 config.yaml 或 WECHAT_WEB_ACCESS_KEY 中配置。
web_access_key: "admin"
# Hook/API 并发数：本地 Hook 默认 20，用于并发发送同一条消息命中的多条规则回复。
# 远程 Hook/远程协议默认 10；修改后需重启后端。
hook_api_concurrency: 20

# --- 前端服务 ---
# Vite 会直接读取 frontend_host/frontend_port。
# Windows 启动脚本发现端口被占用时，会向后尝试最多 10 个端口并回写 frontend_port。
frontend_host: "0.0.0.0"
frontend_port: 80

# --- 远程客户端 DLL 主动连接到本后端的 WS/WSS 长连接 ---
# 仅 wechat_mode=2 时生效；本地 Hook 和远程协议模式会强制忽略此开关。
# 无证书测试：client_wss_scheme="ws"，client_wss_port=5000，
#   DLL 使用 RemoteWS="ws://127.0.0.1:5000/agent"，直连 server_port。
# 正式部署：client_wss_scheme="wss"，client_wss_port=443，
#   DLL 使用 RemoteWS="wss://127.0.0.1/agent"，需 Nginx/Caddy 等提供 TLS 证书并转发到 server_port。
agent_ws_enabled: true
agent_ws_path: "/agent"
client_wss_scheme: "ws"
client_wss_host: "127.0.0.1"
client_wss_port: 5000
agent_ws_request_timeout: 30

# --- 实时消息 ---
# 远程 Hook 的回调复用上面的 Agent WebSocket，无需配置 HTTP 回调地址或端口。
# 消息接收类型：
#   1 = Hook 直接返回 msglist
#   2 = protobuf/raw pb_msg
recvtype: 1

# --- 登录流程行为开关 ---
restart_on_button_login_fail: true
max_restarts_after_button_login_fail: 1

# --- AI 智能回复 ---
# 真实地址和密钥只填写在不受 Git 管理的 config.yaml 中。
ai_base_url: ""
ai_api_key: ""
ai_model: ""
ai_active_profile_id: ""
ai_profiles: []
# 多模型示例（真实密钥只放 config.yaml，不要提交到 Git）：
# ai_active_profile_id: "deepseek"
# ai_profiles:
#   - id: "deepseek"
#     name: "模型配置一"
#     base_url: "https://example.invalid/v1"
#     api_key: ""
#     model: "model-name"
#   - id: "lingsuan"
#     name: "模型配置二"
#     base_url: "https://example.invalid/v1"
#     api_key: ""
#     model: "model-name"
ai_timeout_seconds: 60
ai_max_concurrency: 3

# 数据运维完整流程可能包含多个登录、填报、审核和执行请求。
mcp_timeout_seconds: 600
# MCP 服务地址直接修改下方 url，填写完整的 http(s)://主机:端口/mcp。
# 修改 config.yaml 后重启后端，或打开「AI 与 MCP 设置」重新加载即可生效。
# id 是智能回复任务引用的连接标识，修改地址时保留原 id。
mcp_connections:
- id: local_mcp
  name: mcp系统名称
  url: http://127.0.0.1:5222/mcp
  token: ""   # 数据运维 MCP 必填，与服务器 settings.local.json 的 api_token 一致；不会打包进浏览器 JS。
  enabled: true
# 本地配置和提示词不会提交到 Git；公开示例统一使用占位名称和回环地址。
prompt_config_file: prompts.yaml
prompt_example_file: prompts.example.yaml
network_loopback_host: 127.0.0.1
network_bind_all_host: 0.0.0.0
network_local_aliases:
- 127.0.0.1
- localhost
- ::1
network_agent_host: agent.local
network_http_scheme: http
network_callback_host: 127.0.0.1
protocol_session_list_key: ''
legacy_rdv_mapping_path: ''
mcp_defaults:
  name: mcp系统名称
  url: http://127.0.0.1:5222/mcp
  required_token_ports:
  - 5222
  reply_templates:
    submit_data_maintenance: 需求 {{identifier}} 保存并提交成功，需求编号：{{work_num}}
workflow:
  self_mention_names:
  - 空气
  owner_display_name: ''
  report_author: ''
public_assets:
  wecom_icon_url: ''
labels:
  domp_approval_bridge.approval_reply_prefix: 数据运维审核结果
  domp_city_selection.city_selection_prefix: 数据运维区划选择
  domp_query_bridge.query_reply_prefix: 数据运维查询结果
  domp_query_bridge.problem_query_reply_prefix: 问题平台查询结果
  domp_query_bridge.execution_reply_prefix: 数据运维执行结果
  domp_submission_bridge.submission_reply_prefix: 数据运维填报结果
  domp_unified_bridge.unified_skill_name: 数据运维智能 Agent
  workflow_skill_name: SQL 风险分析及数据运维填报审核执行
  query_skill_name: 任务与数据运维查询 Agent
  execution_skill_name: 数据运维执行 Agent
  approval_skill_name: 数据运维审核 Agent
  submission_skill_name: 数据运维填报 Agent
  offline_city_image_skill_name: 线下申请区划识别
  offline_city_text_skill_name: 线下申请城市识别
